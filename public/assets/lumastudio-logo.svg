<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <mask id="ls-inner-channel">
      <!-- White reveals everything -->
      <rect width="500" height="500" fill="white" />
      
      <!-- Black cuts out the inner channels to make them transparent -->
      <!-- L inner cutout -->
      <path d="M 106 138 V 338 H 350" fill="none" stroke="black" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" />
      
      <!-- S inner cutout -->
      <path d="M 434 162 H 280 A 58 58 0 0 0 280 278 H 360 A 58 58 0 0 1 360 394 H 164 V 418" fill="none" stroke="black" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" />
    </mask>
  </defs>

  <g mask="url(#ls-inner-channel)">
    <!-- Letter L outer thick ribbon -->
    <path d="M 106 114 V 338 H 350" fill="none" stroke="#FF5733" stroke-width="50" stroke-linecap="square" stroke-linejoin="miter" />
    
    <!-- Letter S outer thick ribbon -->
    <path d="M 434 138 H 280 A 58 58 0 0 0 280 254 H 360 A 58 58 0 0 1 360 370 H 140 V 418 H 164" fill="none" stroke="#FF5733" stroke-width="50" stroke-linecap="square" stroke-linejoin="miter" />
  </g>
</svg>